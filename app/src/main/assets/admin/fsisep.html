<script>
// Preenchidos por receber_dados com o que vem do Admin
let PESSOAS = {};
let POLLS = [];

const DURACAO_SLOT_MIN = 30;
const PESO_NUMERO_LIVRES = 0.5;      // mesmo peso que o site usa ao misturar "quantos livres" com a posição no ranking
const NUMERO_CORES_DEPARTAMENTO = 8; // o site tem 8 pares de cores para os avatares
const DIAS_SEMANA = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const INDICE_SEGUNDA = 1;  // Date.getDay(): 0 = domingo, 1 = segunda, …, 5 = sexta
const INDICE_SEXTA = 5;
const MARGEM_TOOLTIP_PX = 6;
const MARGEM_JANELA_PX = 8;

// Estado da página
let poll_atual = null;
let pessoas_escolhidas = [];   // ids escolhidos na lista de membros; vazio = contar toda a gente


// ---------------------------------------------------------------------------
// Funções de apoio: datas, horas, nomes
// ---------------------------------------------------------------------------

/** Converte "HH:MM" em minutos desde a meia-noite. */
function hora_para_minutos(hora) {
  const partes = hora.split(":");
  return Number(partes[0]) * 60 + Number(partes[1]);
}

/** Converte minutos desde a meia-noite em "HH:MM". */
function minutos_para_hora(minutos) {
  const horas = String(Math.floor(minutos / 60)).padStart(2, "0");
  const resto = String(minutos % 60).padStart(2, "0");
  return horas + ":" + resto;
}

/** Devolve a lista de horas de início dos slots de um poll ("08:00", "08:30", …). */
function horas_dos_slots(poll) {
  const horas = [];
  const inicio_min = hora_para_minutos(poll.hora_inicio);
  const fim_min = hora_para_minutos(poll.hora_fim);
  for (let minuto = inicio_min; minuto < fim_min; minuto += DURACAO_SLOT_MIN) {
    horas.push(minutos_para_hora(minuto));
  }
  return horas;
}

/** Dia da semana de uma data: 0 = domingo, 1 = segunda, …, 6 = sábado. */
function dia_da_semana(dia) {
  // ao meio-dia para o fuso horário não mudar o dia
  return new Date(dia + "T12:00:00").getDay();
}

/** "2026-11-02" → "Mon": só o dia da semana, sem dia do mês nem mês. */
function formatar_cabecalho_dia(dia) {
  return DIAS_SEMANA[dia_da_semana(dia)];
}

/** Dias do poll que caem de segunda a sexta (os fins de semana não aparecem). */
function dias_uteis(poll) {
  return poll.dias.filter(dia => {
    const indice = dia_da_semana(dia);
    return indice >= INDICE_SEGUNDA && indice <= INDICE_SEXTA;
  });
}

/** Tira acentos e passa a minúsculas, para a pesquisa não depender disso. */
function normalizar_texto(texto) {
  return texto.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}

/** Ids das pessoas livres num slot (lista vazia se ninguém está livre). */
function ids_livres_no_slot(poll, slot) {
  const texto_ids = poll.livres[slot];
  if (!texto_ids) {
    return [];
  }
  return texto_ids.split(",").map(Number);
}


// ---------------------------------------------------------------------------
// Cores: mesma fórmula do site (AvailabilityGrid)
// ---------------------------------------------------------------------------

/**
 * Cria a função que dá um valor de 0 a 1 para cada número de pessoas livres.
 * Mistura duas coisas, metade cada:
 *  - quantos estão livres a dividir pelo total que conta (respondidos, ou escolhidos na lista de membros)
 *  - a posição desse número no ranking de todos os slots do poll
 * Recebe: lista com o número de livres de cada slot, e o total que conta.
 * Devolve: função (numero_livres) → valor entre 0 e 1.
 */
function criar_escala_cores(contagens_slots, total_que_conta) {
  const numero_slots = contagens_slots.length;

  // quantos slots têm cada número de livres
  const frequencia = new Map();
  for (const contagem of contagens_slots) {
    frequencia.set(contagem, (frequencia.get(contagem) || 0) + 1);
  }

  // posição de cada número no ranking (percentil ao meio do grupo)
  const posicao_ranking = new Map();
  const contagens_ordenadas = [...frequencia.keys()].sort((a, b) => a - b);
  let slots_abaixo = 0;
  for (const contagem of contagens_ordenadas) {
    const slots_com_esta_contagem = frequencia.get(contagem);
    posicao_ranking.set(contagem, (slots_abaixo + slots_com_esta_contagem / 2) / numero_slots);
    slots_abaixo += slots_com_esta_contagem;
  }

  const ha_variedade = frequencia.size > 1;

  return function (numero_livres) {
    let fracao_livres = 0;
    if (total_que_conta > 0) {
      fracao_livres = Math.min(numero_livres / total_que_conta, 1);
    }
    if (!ha_variedade) {
      return fracao_livres;
    }
    return PESO_NUMERO_LIVRES * fracao_livres + (1 - PESO_NUMERO_LIVRES) * posicao_ranking.get(numero_livres);
  };
}

/** Valor 0..1 → cor de vermelho (0) a verde (1), igual ao site. */
function cor_do_valor(valor) {
  const valor_limitado = Math.min(Math.max(valor, 0), 1);
  const matiz = Math.round(valor_limitado * 120);
  return "hsl(" + matiz + " 65% 42% / 0.85)";
}

/** Índice (1..8) da cor do avatar, a partir do nome (mesmo hash do site). */
function indice_cor_avatar(nome) {
  const texto = (nome || "?").trim().toLowerCase();
  let hash = 7;
  for (let i = 0; i < texto.length; i++) {
    hash = (hash * 33 + texto.charCodeAt(i)) | 0;
  }
  return (Math.abs(hash) % NUMERO_CORES_DEPARTAMENTO) + 1;
}

/** Iniciais do nome: primeira letra do primeiro e do último nome. */
function iniciais(nome) {
  const partes = nome.trim().split(/\s+/);
  if (partes.length === 1) {
    return partes[0].slice(0, 2).toUpperCase();
  }
  return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
}

/** Cria o elemento do avatar com as iniciais e o nome ao lado. */
function criar_avatar(id_pessoa) {
  const nome = PESSOAS[id_pessoa];
  const cor = indice_cor_avatar(nome);

  const caixa = document.createElement("span");
  caixa.className = "person-avatar-wrap";

  const circulo = document.createElement("span");
  circulo.className = "person-avatar";
  circulo.style.backgroundColor = "var(--color-dept-" + cor + "-bg)";
  circulo.style.color = "var(--color-dept-" + cor + "-text)";
  circulo.textContent = iniciais(nome);

  const texto_nome = document.createElement("span");
  texto_nome.className = "person-avatar-name";
  texto_nome.textContent = nome;

  caixa.append(circulo, texto_nome);
  return caixa;
}


// ---------------------------------------------------------------------------
// Contagem com ou sem membros escolhidos
// ---------------------------------------------------------------------------

/** Está a filtrar por membros escolhidos na lista? */
function esta_a_filtrar() {
  return pessoas_escolhidas.length > 0;
}

/** Pessoas livres num slot que contam (todas, ou só os membros escolhidos). */
function pessoas_livres_que_contam(slot) {
  const livres = ids_livres_no_slot(poll_atual, slot);
  if (!esta_a_filtrar()) {
    return livres;
  }
  return livres.filter(id_pessoa => pessoas_escolhidas.includes(id_pessoa));
}

/** Total no denominador do tooltip ("X / total free"): convidados, ou escolhidos. */
function total_no_tooltip() {
  if (esta_a_filtrar()) {
    return pessoas_escolhidas.length;
  }
  return poll_atual.convidados.length;
}

/** Total usado na escala de cores: quem respondeu (entre os escolhidos, se houver filtro). */
function total_para_cores() {
  if (!esta_a_filtrar()) {
    return poll_atual.responderam.length;
  }
  const escolhidos_que_responderam = pessoas_escolhidas.filter(id_pessoa => poll_atual.responderam.includes(id_pessoa));
  return escolhidos_que_responderam.length;
}


// ---------------------------------------------------------------------------
// Desenhar a página
// ---------------------------------------------------------------------------

/** Desenha as abas (uma por poll) e marca a que está aberta. */
function desenhar_abas() {
  const caixa_abas = document.getElementById("abas-polls");
  caixa_abas.innerHTML = "";
  for (const poll of POLLS) {
    const aba = document.createElement("button");
    aba.type = "button";
    aba.className = "mode-tab";
    if (poll === poll_atual) {
      aba.classList.add("mode-tab--active");
    }
    aba.textContent = poll.titulo;
    aba.addEventListener("click", () => abrir_poll(poll));
    caixa_abas.appendChild(aba);
  }
}

/** Escreve o título e a linha "Mon–Fri · horas · convidados · respostas". */
function desenhar_cabecalho() {
  document.getElementById("titulo-poll").textContent = poll_atual.titulo;
  document.getElementById("subtitulo-poll").textContent =
    "Mon–Fri" +
    " · " + poll_atual.hora_inicio + "–" + poll_atual.hora_fim +
    " · " + poll_atual.convidados.length + " invited" +
    " · " + poll_atual.responderam.length + " answered";
  document.title = poll_atual.titulo;
}

/** Desenha a grelha dias × horas com as cores do overlap. */
function desenhar_grelha() {
  const grelha = document.getElementById("grelha");
  const horas = horas_dos_slots(poll_atual);
  const dias_visiveis = dias_uteis(poll_atual);
  grelha.innerHTML = "";
  grelha.style.gridTemplateColumns = "var(--coluna-horas) repeat(" + dias_visiveis.length + ", minmax(var(--coluna-dia), 1fr))";

  // escala de cores calculada com todos os slots do poll (incluindo o fim de semana),
  // para as cores ficarem iguais às do site
  const contagens = [];
  for (const dia of poll_atual.dias) {
    for (const hora of horas) {
      contagens.push(pessoas_livres_que_contam(dia + "T" + hora).length);
    }
  }
  const total_cores = total_para_cores();
  const escala = criar_escala_cores(contagens, total_cores);

  // linha de cima: canto vazio + nome de cada dia
  const canto = document.createElement("div");
  canto.className = "avail-corner";
  grelha.appendChild(canto);
  for (const dia of dias_visiveis) {
    const cabecalho = document.createElement("div");
    cabecalho.className = "avail-date-head";
    cabecalho.textContent = formatar_cabecalho_dia(dia);
    grelha.appendChild(cabecalho);
  }

  // uma linha por hora: etiqueta + uma célula por dia
  for (const hora of horas) {
    const etiqueta = document.createElement("div");
    etiqueta.className = "avail-time-label";
    etiqueta.innerHTML = '<span class="avail-time-text">' + hora + "</span>";
    grelha.appendChild(etiqueta);

    for (const dia of dias_visiveis) {
      grelha.appendChild(criar_celula(dia + "T" + hora, escala, total_cores));
    }
  }
}

/** Cria a célula de um slot, com a cor e os eventos do tooltip. */
function criar_celula(slot, escala, total_cores) {
  const livres = pessoas_livres_que_contam(slot);
  const celula = document.createElement("button");
  celula.type = "button";
  celula.className = "avail-cell";
  celula.tabIndex = 0;

  // com uma só pessoa escolhida mostra-se o horário dela:
  // verde onde está livre, vazio onde não está
  const mostra_horario_de_uma_pessoa = (pessoas_escolhidas.length === 1);
  if (mostra_horario_de_uma_pessoa) {
    const pessoa_livre = (livres.length > 0);
    if (pessoa_livre) {
      celula.style.backgroundColor = cor_do_valor(1);
    }
  } else if (total_cores > 0) {
    celula.style.backgroundColor = cor_do_valor(escala(livres.length));
  }

  const nomes = livres.map(id_pessoa => PESSOAS[id_pessoa]).join(", ");
  let descricao = livres.length + " / " + total_no_tooltip() + " free";
  if (nomes) {
    descricao += ": " + nomes;
  }
  celula.setAttribute("aria-label", descricao);

  celula.addEventListener("pointerenter", () => mostrar_tooltip(slot, celula));
  celula.addEventListener("pointerleave", esconder_tooltip);
  celula.addEventListener("focus", () => mostrar_tooltip(slot, celula));
  celula.addEventListener("blur", esconder_tooltip);
  return celula;
}

/** Pinta a barra da legenda com as 5 cores de referência do site. */
function desenhar_legenda() {
  const cores = [0, 0.25, 0.5, 0.75, 1].map(cor_do_valor);
  document.getElementById("barra-legenda").style.background = "linear-gradient(to right, " + cores.join(", ") + ")";
}

/** Mostra a frase que explica o que a grelha está a mostrar, quando há membros escolhidos. */
function desenhar_aviso_filtro() {
  const aviso = document.getElementById("aviso-filtro");
  if (!esta_a_filtrar()) {
    aviso.hidden = true;
    return;
  }
  const nao_responderam = pessoas_escolhidas.filter(id_pessoa => !poll_atual.responderam.includes(id_pessoa));
  let texto;
  if (pessoas_escolhidas.length === 1) {
    texto = "Showing " + PESSOAS[pessoas_escolhidas[0]] + "'s availability (green = free).";
  } else {
    texto = "Showing overlap for " + pessoas_escolhidas.length + " selected people.";
  }
  if (nao_responderam.length > 0) {
    const nomes = nao_responderam.map(id_pessoa => PESSOAS[id_pessoa]).join(", ");
    texto += " Not answered yet: " + nomes + ".";
  }
  aviso.textContent = texto;
  aviso.hidden = false;
}

/** Guarda os dados vindos do Admin e mostra a página; sem dados fica o aviso. */
function receber_dados(dados) {
  if (!dados || !dados.polls || dados.polls.length === 0) {
    document.getElementById("aviso-dados").textContent = "Sem dados: esta conta não tem os meeting polls guardados, ou ainda não houve ligação à cloud.";
    document.body.classList.add("a-espera");
    return;
  }
  PESSOAS = dados.pessoas;
  POLLS = dados.polls;
  poll_atual = POLLS.find(poll => poll_atual && poll.id === poll_atual.id) || POLLS[0];
  document.body.classList.remove("a-espera");
  desenhar_tudo();
}

/** Abre um poll (ao mudar de aba) e redesenha tudo. */
function abrir_poll(poll) {
  poll_atual = poll;
  // só ficam escolhidas as pessoas que também estão convidadas neste poll
  pessoas_escolhidas = pessoas_escolhidas.filter(id_pessoa => poll.convidados.includes(id_pessoa));
  desenhar_tudo();
}

/** Redesenha a página inteira com o estado atual. */
function desenhar_tudo() {
  desenhar_abas();
  desenhar_cabecalho();
  desenhar_lista_membros();
  desenhar_aviso_filtro();
  // com uma só pessoa a grelha é verde/vazio, por isso a escala de cores não faz sentido
  document.getElementById("legenda").hidden = (pessoas_escolhidas.length === 1);
  desenhar_grelha();
}


// ---------------------------------------------------------------------------
// Tooltip ao passar por cima de uma célula
// ---------------------------------------------------------------------------

/**
 * Mostra o tooltip com "X / N free" e a lista de quem está livre.
 * Fica por cima da célula se couber, senão por baixo (como no site).
 */
function mostrar_tooltip(slot, celula) {
  const tooltip = document.getElementById("tooltip");
  const livres = pessoas_livres_que_contam(slot);

  tooltip.innerHTML = "";
  tooltip.style.maxHeight = "";
  const contagem = document.createElement("p");
  contagem.className = "avail-tooltip-count";
  contagem.textContent = livres.length + " / " + total_no_tooltip() + " free";
  tooltip.appendChild(contagem);

  for (const id_pessoa of livres) {
    tooltip.appendChild(criar_avatar(id_pessoa));
  }
  if (livres.length === 0) {
    const vazio = document.createElement("p");
    vazio.className = "avail-tooltip-empty";
    vazio.textContent = "No one free";
    tooltip.appendChild(vazio);
  }

  tooltip.hidden = false;
  posicionar_tooltip(tooltip, celula);
  tooltip.classList.add("avail-tooltip--ready");
}

/** Calcula onde pôr o tooltip para não sair da janela. */
function posicionar_tooltip(tooltip, celula) {
  const caixa_celula = celula.getBoundingClientRect();
  const caixa_tooltip = tooltip.getBoundingClientRect();
  const espaco_em_cima = caixa_celula.top - MARGEM_JANELA_PX - MARGEM_TOOLTIP_PX;
  const espaco_em_baixo = window.innerHeight - caixa_celula.bottom - MARGEM_JANELA_PX - MARGEM_TOOLTIP_PX;

  const cabe_em_cima = caixa_tooltip.height <= espaco_em_cima;
  const ha_mais_espaco_em_cima = espaco_em_cima >= espaco_em_baixo;
  const vai_para_cima = cabe_em_cima || ha_mais_espaco_em_cima;

  let espaco_disponivel = vai_para_cima ? espaco_em_cima : espaco_em_baixo;
  espaco_disponivel = Math.max(espaco_disponivel, 0);
  const altura = Math.min(caixa_tooltip.height, espaco_disponivel);

  let topo;
  if (vai_para_cima) {
    topo = caixa_celula.top - MARGEM_TOOLTIP_PX - altura;
  } else {
    topo = caixa_celula.bottom + MARGEM_TOOLTIP_PX;
  }

  const esquerda_centrada = caixa_celula.left + caixa_celula.width / 2 - caixa_tooltip.width / 2;
  const esquerda_maxima = Math.max(window.innerWidth - caixa_tooltip.width - MARGEM_JANELA_PX, MARGEM_JANELA_PX);
  const esquerda = Math.min(Math.max(esquerda_centrada, MARGEM_JANELA_PX), esquerda_maxima);

  tooltip.style.top = topo + "px";
  tooltip.style.left = esquerda + "px";
  tooltip.style.maxHeight = espaco_disponivel + "px";
}

/** Esconde o tooltip. */
function esconder_tooltip() {
  const tooltip = document.getElementById("tooltip");
  tooltip.classList.remove("avail-tooltip--ready");
  tooltip.hidden = true;
}


// ---------------------------------------------------------------------------
// Lista de membros à direita (com pesquisa)
// ---------------------------------------------------------------------------

/** Convidados do poll aberto cujo nome contém o texto da pesquisa, por ordem alfabética. */
function procurar_membros(texto) {
  const texto_normalizado = normalizar_texto(texto);
  const encontrados = [];
  for (const id_pessoa of poll_atual.convidados) {
    const nome_normalizado = normalizar_texto(PESSOAS[id_pessoa]);
    if (nome_normalizado.includes(texto_normalizado)) {
      encontrados.push(id_pessoa);
    }
  }
  encontrados.sort((a, b) => PESSOAS[a].localeCompare(PESSOAS[b]));
  return encontrados;
}

/** Desenha a lista de membros; os escolhidos ficam realçados. */
function desenhar_lista_membros() {
  const lista = document.getElementById("lista-membros");
  const texto_pesquisa = document.getElementById("caixa-pesquisa").value;
  const encontrados = procurar_membros(texto_pesquisa);
  lista.innerHTML = "";

  if (encontrados.length === 0) {
    const sem_resultados = document.createElement("li");
    sem_resultados.className = "members-empty";
    sem_resultados.textContent = "No people found";
    lista.appendChild(sem_resultados);
  }

  for (const id_pessoa of encontrados) {
    lista.appendChild(criar_item_membro(id_pessoa));
  }

  // o "Clear" só aparece quando há alguém escolhido
  document.getElementById("limpar-membros").hidden = !esta_a_filtrar();
}

/** Cria a linha de um membro: avatar, nome e aviso se ainda não respondeu. */
function criar_item_membro(id_pessoa) {
  const item = document.createElement("li");
  const botao = document.createElement("button");
  botao.type = "button";
  botao.className = "member-item";

  const esta_escolhido = pessoas_escolhidas.includes(id_pessoa);
  if (esta_escolhido) {
    botao.classList.add("member-item--selected");
  }
  botao.setAttribute("aria-pressed", String(esta_escolhido));
  botao.appendChild(criar_avatar(id_pessoa));

  const ja_respondeu = poll_atual.responderam.includes(id_pessoa);
  if (!ja_respondeu) {
    const etiqueta = document.createElement("span");
    etiqueta.className = "member-tag";
    etiqueta.textContent = "no answer";
    botao.appendChild(etiqueta);
  }

  botao.addEventListener("click", () => alternar_membro(id_pessoa));
  item.appendChild(botao);
  return item;
}

/** Escolhe o membro se ainda não estava escolhido; tira-o se já estava. Redesenha a página. */
function alternar_membro(id_pessoa) {
  if (pessoas_escolhidas.includes(id_pessoa)) {
    pessoas_escolhidas = pessoas_escolhidas.filter(id => id !== id_pessoa);
  } else {
    pessoas_escolhidas.push(id_pessoa);
  }
  desenhar_tudo();
}

/** Liga a caixa de pesquisa (filtra a lista) e o botão "Clear". */
function ligar_lista_membros() {
  const caixa = document.getElementById("caixa-pesquisa");
  caixa.addEventListener("input", desenhar_lista_membros);
  caixa.addEventListener("keydown", evento => {
    // Enter escolhe o primeiro membro da lista filtrada
    if (evento.key !== "Enter") {
      return;
    }
    const encontrados = procurar_membros(caixa.value);
    if (encontrados.length > 0) {
      caixa.value = "";
      alternar_membro(encontrados[0]);
    }
  });

  document.getElementById("limpar-membros").addEventListener("click", () => {
    pessoas_escolhidas = [];
    desenhar_tudo();
  });
}


// ---------------------------------------------------------------------------
// Janela "Who answered" e tema claro/escuro
// ---------------------------------------------------------------------------

/** Cria uma secção da janela (título, número e lista de pessoas). */
function criar_secao_respostas(titulo, ids_pessoas, texto_se_vazio) {
  const secao = document.createElement("section");
  const cabecalho = document.createElement("h3");
  cabecalho.className = "ans-title";
  cabecalho.innerHTML = titulo + ' <span class="ans-count">' + ids_pessoas.length + "</span>";
  secao.appendChild(cabecalho);

  if (ids_pessoas.length === 0) {
    const vazio = document.createElement("p");
    vazio.className = "ans-empty";
    vazio.textContent = texto_se_vazio;
    secao.appendChild(vazio);
    return secao;
  }

  const lista = document.createElement("ul");
  lista.className = "ans-list";
  const ordenados = [...ids_pessoas].sort((a, b) => PESSOAS[a].localeCompare(PESSOAS[b]));
  for (const id_pessoa of ordenados) {
    const item = document.createElement("li");
    item.appendChild(criar_avatar(id_pessoa));
    lista.appendChild(item);
  }
  secao.appendChild(lista);
  return secao;
}

/** Abre a janela com quem respondeu e quem falta, para o poll aberto. */
function abrir_janela_respostas() {
  const corpo = document.getElementById("corpo-janela");
  const responderam = poll_atual.convidados.filter(id_pessoa => poll_atual.responderam.includes(id_pessoa));
  const faltam = poll_atual.convidados.filter(id_pessoa => !poll_atual.responderam.includes(id_pessoa));

  corpo.innerHTML = "";
  corpo.appendChild(criar_secao_respostas("Not answered yet", faltam, "Everyone has answered."));
  corpo.appendChild(criar_secao_respostas("Answered", responderam, "Nobody has answered yet."));
  document.getElementById("janela-respostas").hidden = false;
  window.parent.postMessage({ fsisepJanela: true }, "*");
}

function fechar_janela_respostas() {
  document.getElementById("janela-respostas").hidden = true;
  window.parent.postMessage({ fsisepJanela: false }, "*");
}

/** Aplica o tema e marca o ícone certo no botão. */
function aplicar_tema(tema) {
  const tema_claro = (tema === "light");
  if (tema_claro) {
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  document.getElementById("icone-claro").classList.toggle("ativo", tema_claro);
  document.getElementById("icone-escuro").classList.toggle("ativo", !tema_claro);
}

function ligar_botoes() {
  document.getElementById("botao-quem-respondeu").addEventListener("click", abrir_janela_respostas);
  document.getElementById("fechar-janela").addEventListener("click", fechar_janela_respostas);
  document.getElementById("janela-respostas").addEventListener("click", evento => {
    // clicar fora do painel fecha a janela
    if (evento.target.id === "janela-respostas") {
      fechar_janela_respostas();
    }
  });
  document.getElementById("botao-tema").addEventListener("click", () => {
    const esta_claro = document.documentElement.getAttribute("data-theme") === "light";
    aplicar_tema(esta_claro ? "dark" : "light");
  });
  // tal como no site, o tooltip esconde-se ao fazer scroll ou mudar o tamanho da janela
  window.addEventListener("scroll", esconder_tooltip, { capture: true, passive: true });
  window.addEventListener("resize", esconder_tooltip);
}


// ---------------------------------------------------------------------------
// Arranque
// ---------------------------------------------------------------------------
aplicar_tema("dark");
desenhar_legenda();
ligar_lista_membros();
ligar_botoes();
window.addEventListener("message", evento => {
  if (evento.source !== window.parent || !evento.data) {
    return;
  }
  if ("fsisep" in evento.data) {
    receber_dados(evento.data.fsisep);
  }
  if (evento.data.fsisepFechar) {
    fechar_janela_respostas();
  }
});
window.parent.postMessage({ fsisepPronta: true }, "*");
</script>
